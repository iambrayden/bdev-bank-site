# Coolify: create a "Docker Compose" resource from this repo, then set the
# environment variables in the Coolify UI. Assign a domain to the `app` service.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PLAYERS_TABLE=${PLAYERS_TABLE:-players}
      - AUDIT_TABLES=${AUDIT_TABLES:-}
      - TZ_DISPLAY=${TZ_DISPLAY:-UTC}
      - APP_NAME=${APP_NAME:-SAFIN}
      - APP_TAGLINE=${APP_TAGLINE:-San Andreas Financial Intelligence Network}
      - BANNER_TEXT=${BANNER_TEXT:-Restricted · Authorized use only · All activity is monitored and logged}
    volumes:
      - audit-data:/data
    expose:
      - "3000"
volumes:
  audit-data:
